<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DrayFlexChat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <div>
                <h1>DrayFlexChat</h1>
                <p>Multimodal AI Assistant</p>
            </div>

            <span class="status">
                ● Online
            </span>
        </header>


        <main class="chat-container">

            <div id="chatMessages" class="chat-messages">

                <div class="message assistant-message">
                    <div class="message-name">
                        DrayFlexChat
                    </div>

                    <div class="message-content">
                        Hello! I'm DrayFlexChat. How can I help you today?
                    </div>
                </div>

            </div>


            <div class="input-area">

                <textarea
                    id="messageInput"
                    placeholder="Message DrayFlexChat..."
                    rows="1"
                ></textarea>

                <button id="sendButton">
                    Send
                </button>

            </div>

        </main>

    </div>

    <script src="app.js"></script>

</body>
</html>
